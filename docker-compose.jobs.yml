name: repolens-ai
services:
  db:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: ${REPOLENS_DB_PASSWORD:?Set REPOLENS_DB_PASSWORD}
      POSTGRES_DB: repolens_ai
    ports: ["5434:5432"]
    volumes: [repolens_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment: &backend
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set a shared random SECRET_KEY of at least 32 bytes}
      DATABASE_URL: postgresql+asyncpg://repolens:${REPOLENS_DB_PASSWORD}@db:5432/repolens_ai
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      EMBEDDING_LMSTUDIO_MODEL: ${EMBEDDING_LMSTUDIO_MODEL:-text-embedding-nomic-embed-text-v1.5}
      EMBEDDING_LMSTUDIO_DIMENSIONS: ${EMBEDDING_LMSTUDIO_DIMENSIONS:-768}
      EMBEDDING_LMSTUDIO_MAX_REQUESTS: ${EMBEDDING_LMSTUDIO_MAX_REQUESTS:-512}
      EMBEDDING_MISTRAL_BASE_URL: ${EMBEDDING_MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      EMBEDDING_MISTRAL_MODEL: ${EMBEDDING_MISTRAL_MODEL:-mistral-embed}
      EMBEDDING_MISTRAL_DIMENSIONS: ${EMBEDDING_MISTRAL_DIMENSIONS:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_MAX_INPUT_TOKENS: ${EMBEDDING_MAX_INPUT_TOKENS:-2048}
      EMBEDDING_MAX_BATCH_TOKENS: ${EMBEDDING_MAX_BATCH_TOKENS:-8192}
      EMBEDDING_MAX_CHUNKS: ${EMBEDDING_MAX_CHUNKS:-2000}
      EMBEDDING_MAX_INDEX_TOKENS: ${EMBEDDING_MAX_INDEX_TOKENS:-500000}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_RETRIES: ${EMBEDDING_RETRIES:-2}
      SEMANTIC_SEARCH_HOSTED_QUERY_ALLOWED: ${SEMANTIC_SEARCH_HOSTED_QUERY_ALLOWED:-false}
      HYBRID_SEARCH_TIMEOUT_SECONDS: ${HYBRID_SEARCH_TIMEOUT_SECONDS:-55}
      GENERATION_PROTOCOL: ${GENERATION_PROTOCOL:-lmstudio-native}
      GENERATION_BASE_URL: ${GENERATION_BASE_URL:-http://host.docker.internal:1235/v1}
      GENERATION_MODEL: ${GENERATION_MODEL:-qwen/qwen3.5-9b}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-90}
      GENERATION_MAX_INPUT_BYTES: ${GENERATION_MAX_INPUT_BYTES:-4096}
      GENERATION_MAX_OUTPUT_TOKENS: ${GENERATION_MAX_OUTPUT_TOKENS:-512}
      GENERATION_MAX_RESPONSE_BYTES: ${GENERATION_MAX_RESPONSE_BYTES:-65536}
      GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-1}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0}
      GENERATION_LOCAL_API_KEY: ${GENERATION_LOCAL_API_KEY:-}
      QA_TIMEOUT_SECONDS: ${QA_TIMEOUT_SECONDS:-180}
      SEMANTIC_SEARCH_CONCURRENCY: ${SEMANTIC_SEARCH_CONCURRENCY:-2}
      SEMANTIC_SEARCH_TIMEOUT_SECONDS: ${SEMANTIC_SEARCH_TIMEOUT_SECONDS:-45}
      SEMANTIC_SEARCH_MAX_PROVIDER_REQUESTS: ${SEMANTIC_SEARCH_MAX_PROVIDER_REQUESTS:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lmstudio}
      EMBEDDING_LMSTUDIO_BASE_URL: ${EMBEDDING_LMSTUDIO_BASE_URL:-http://host.docker.internal:1235/v1}
      EMBEDDING_LMSTUDIO_API_KEY: ${EMBEDDING_LMSTUDIO_API_KEY:-}
      EMBEDDING_LMSTUDIO_VERSION: ${EMBEDDING_LMSTUDIO_VERSION:-nomic-v1.5-q4_k_m-v1}
      EMBEDDING_LMSTUDIO_QUANTIZATION: ${EMBEDDING_LMSTUDIO_QUANTIZATION:-Q4_K_M}
      EMBEDDING_MISTRAL_API_KEY: ${EMBEDDING_MISTRAL_API_KEY:-}
      EMBEDDING_MISTRAL_VERSION: ${EMBEDDING_MISTRAL_VERSION:-mistral-embed-2312-v1}
      EMBEDDING_HOSTED_SOURCE_ALLOWED: ${EMBEDDING_HOSTED_SOURCE_ALLOWED:-false}
      EMBEDDING_MISTRAL_MAX_REQUESTS: ${EMBEDDING_MISTRAL_MAX_REQUESTS:-0}
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    command: ["python", "-m", "workers.run"]
    environment:
      <<: *backend
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-10}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-5}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-300}
    stop_grace_period: 120s
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  repolens_pgdata:
